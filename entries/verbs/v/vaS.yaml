  notes: 'This refers to side-to-side distance, and does not have the metaphorical
    meanings such as "broad topic" or "wide range of opinions", nor is it used for
    the sense of "to the full extent" such as "eyes wide open".[1]


    This and {lang:v} can be used both for the outer measurement of a thing, and also
    the inner measurement of an opening, for instance.[2]'
