entry:
  entry_name: jo'Ha'
  slug: jo'Ha'_v
  part_of_speech: v:t_c,deriv
  pos: v
  pos_subtype: t_c
  metadata_tags:
  - deriv
  status: canonical
  section: main
  definition:
    text: zoom out, summarize, deflate
    parts:
    - text: zoom out
    - text: summarize
    - text: deflate
  antonyms: '{jo'':v:2}'
  see_also: '{''enno:n}'
  notes: 'In the sense of "zoom out", this is applied to something that was previously
    zoomed in on.[1]


    There is a related slang term, {ngajmoH:v}, literally "shorten", referring to
    duration.[2]'
  hidden_notes: At {qep'a' 28 (2021):src}, this was defined as "zoom out".[1] At {qep'a'
    33 (2026):src}, this was expanded to include "summarize" and "deflate".[2]
  sources:
    raw: '[1] {qep''a'' 28 (2021):src}, [2] {qep''a'' 33 (2026):src}'
    citations:
    - source: qepa_2021
      date: '2021'
    - source: qepa_2026
      date: '2026'
  translations:
    de:
      definition: herauszoomen, zusammenfassen, Luft ablassen
      notes: 'Dies wird benutzt, wenn man vorher hineingezoomt hatte.[1]


        Es gibt auch den Slang-Ausdruck {ngajmoH:v}, wörtlich "verkürzen", bezogen
        auf Dauer.[2]'
    fa:
      definition: کوچک نمایی
    sv:
      definition: zooma ut
    ru:
      definition: уменьшить
    zh_HK:
      definition: 縮小
    pt:
      definition: Reduzir o zoom
    fi:
      definition: loitontaa, zoomata pois jostakin
    fr:
      definition: dézoomer, résumer, dégonfler
      notes: 'Ce verbe s''utilise pour une chose sur laquelle on avait auparavant
        zoomé.


        Il y a aussi le mot familier {ngajmoH:v}, littéralement "raccourcir", en référence
        à une durée.[2]'
