  pos_subtype: t
  status: canonical
  section: main
  definition: intercept
  see_also: '{jon:v}, {bot:v:1}'
  notes: This usually refers to intercepting a radio transmission or the like. It
    is used less frequently for physically interfering with or preventing the progress
    of something, for which {bot:v:1} is often employed.[1]
  hidden_notes: To "pick up" a radio transmission.
  sources:
    raw: '[1] {qep''a'' 33 (2026):src}'
    citations:
    - source: qepa_2026
      date: '2026'
  translations:
    de:
      definition: abfangen
      notes: Dies bezieht sich normalerweise auf das Abfangen einer Radioübertragung
        oder etwas Ähnlichem. Es wird seltener für das physische Verhindern eines
        Vorgangs oder Ähnliches benutzt, wofür man eher {bot:v:1} verwendet.[1]
