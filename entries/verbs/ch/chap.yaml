      definition: offiziell sein, überprüft sein, autorisiert sein, legitim sein
    fa:
      definition: رسمی، معتبر، مجاز، مشروع بودن
    sv:
      definition: vara officiell, vara autentiserad, vara auktoriserad, vara legitim
