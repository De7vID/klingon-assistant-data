entry:
  entry_name: labmIt
  slug: labmIt_n
  part_of_speech: n:anim
  pos: n
  categories:
  - anim
  status: canonical
  section: main
  definition: cicada
  synonyms: '{ghum ghew:n}'
  see_also: '{ghew:n}'
  notes: This is an insect found on {Qo'noS:n} which, like a cicada, can be rather
    noisy. To refer to the Terran insect, say {tera' labmIt:sen@@tera':n, labmIt:n}
    if clarity is needed. The {labmIt:n:nolink} is often informally referred to as
    {ghum ghew:n:nolink}, presumably because of what its "song" may resemble.[1]
  hidden_notes: Reversed, this is {tImbal:sen:nolink} "tymbal", the organ with which
    a cicada produces its sound.
  sources:
    raw: '[1] {qep''a'' 33 (2026):src}'
    citations:
    - source: qepa_2026
      date: '2026'
  translations:
    de:
      definition: Zikade
      notes: Dies ist ein Insekt auf {Qo'noS:n}, das, wie eine Zikade, ziemlich laut
        sein kann. Für das terranische Insekt sagt man {tera' labmIt:sen@@tera':n,
        labmIt:n}, wenn Klarheit nötig ist. Ein {labmIt:n:nolink} wird informell auch
        oft {ghum ghew:n:nolink} "Alarminsekt" genannt, wahrscheinlich aufgrund dessen,
        wie sein "Gesang" klingt.[1]
    fa:
      definition: سیکادا [AUTOTRANSLATED]
    sv:
      definition: cikada [AUTOTRANSLATED]
    ru:
      definition: цикада [AUTOTRANSLATED]
    zh_HK:
      definition: 蟬 [AUTOTRANSLATED]
    pt:
      definition: cigarra [AUTOTRANSLATED]
    fi:
      definition: eräs laulukaskasta muistuttava hyönteinen
    fr:
      definition: cigale
      notes: Ceci est un insecte sur {Qo'noS:n} qui, comme une cigale, peut être assez
        bruyant. Pour parler de l'insecte terrien, on dit {tera' labmIt:sen@@tera':n,
        labmIt:n}, s'il faut clarifier. Informellement, on appelle aussi le {labmIt:n:nolink}
        {ghum ghew:n:nolink} "insecte alarme", probablement à cause de la "chanson"
        qu'il produit.[1]
