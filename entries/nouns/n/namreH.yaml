    - text: gazebo
  notes: A shelter or building constructed in a park, garden, or other picturesque
    outdoor space, offering an open view of the surrounding area.[1]
  hidden_notes: Reversed, this is "Herman". Herman the pigeon had a credited part
    in the film "The Gazebo" (1959).
