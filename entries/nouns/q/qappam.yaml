  status: canonical
  section: main
  definition: foundation (structure)
  see_also: '{qach:n}, {Qutlh:v}, {romton:n}'
  notes: This refers to the supporting understructure of a building.
  hidden_notes: 'This was defined as "foundation". The word "structure" was added
    to distinguish this from {ghanroq:n}.

    Reverse of "map" + {paq:n:1h} "book", i.e., "atlas". In mythology, Atlas holds
    up the sky. In architectural sculpture, an atlas is a support structure for a
    building sculpted in the form of a man.'
