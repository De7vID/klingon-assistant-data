entry:
  entry_name: mu''um
  slug: mu''um_n
  part_of_speech: n
  pos: n
  status: canonical
  section: main
  definition: palindrome
  see_also: '{ngeHvuymItlh:n}'
  notes: It is possible to say things like {mu''um mu':sen@@mu''um:n, mu':n}, {mu''um
    'erQen:sen@@mu''um:n, 'erQen:n}, {mu''um mu'tlhegh:sen@@mu''um:n, mu'tlhegh:n},
    or even {mu'tlhegh mu''um:sen@@mu'tlhegh:n, mu''um:n} and so on, depending on
    the focus of the utterance.[1]
  hidden_notes: '{''um:v} is {mu'':n} spelled backwards, so the word is itself a palindrome.'
  components: '{mu'':n}, {''um:v}'
  sources:
    raw: '[1] {qep''a'' 33 (2026):src}'
    citations:
    - source: qepa_2026
      date: '2026'
  translations:
    de:
      definition: Palindrom
      notes: Man kann auch so etwas wie {mu''um mu':sen@@mu''um:n, mu':n}, {mu''um
        'erQen:sen@@mu''um:n, 'erQen:n}, {mu''um mu'tlhegh:sen@@mu''um:n, mu'tlhegh:n}
        oder sogar {mu'tlhegh mu''um:sen@@mu'tlhegh:n, mu''um:n} und so weiter sagen,
        je nachdem, worauf die Betonung der Aussage liegt.[1]
