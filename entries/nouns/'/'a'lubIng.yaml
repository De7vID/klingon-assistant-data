  definition: brooch
  see_also: '{Degh:n:1}'
  notes: A {'a'lubIng:n:nolink} is purely decorative, having no association with office,
    membership, rank, etc.[1]
  hidden_notes: In xifan hol, dropping the {qaghwI':n}, this is "alubif", which is
    the reverse of "fibula", a type of brooch for fastening garments.
