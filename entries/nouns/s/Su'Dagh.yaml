    fr:
      definition: pas
      notes: L'acte de mettre une jambe ou un pied devant l'autre quand on marche
        ou court. Pour indiquer la distance d'un seul pas, on utilise {Su'Dagh chuq:sen@@Su'Dagh:n,
        chuq:n}.[1]
