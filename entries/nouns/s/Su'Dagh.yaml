entry:
  entry_name: Su'Dagh
  slug: Su'Dagh_n
  part_of_speech: n
  pos: n
  status: canonical
  section: main
  definition: step
  see_also: '{ta''lIp:n}'
  notes: This is the act of putting one leg or foot in front of the other when walking
    or running. To indicate the distance covered in a single step, use {Su'Dagh chuq:sen@@Su'Dagh:n,
    chuq:n}.[1]
  sources:
    raw: '[1] {qep''a'' 33 (2026):src}'
    citations:
