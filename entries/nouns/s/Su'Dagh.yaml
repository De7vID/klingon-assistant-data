      date: '2026'
  translations:
    de:
      definition: Schritt
      notes: Dies ist die Handlung, ein Bein oder einen Fuß vor den anderen zu setzen,
        wenn man geht oder rennt. Um die Distanz eines einzelnen Schritts auszudrücken,
        benutzt man {Su'Dagh chuq:sen@@Su'Dagh:n, chuq:n}.[1]
