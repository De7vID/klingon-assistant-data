    A {HIl''aD:n:nolink} is a set of {''ISteghmey:n@@''IStegh:n, -mey:n}.[2]


    It can be preceded by {De''wI'':n} or {mI''QeD:n} if need be.[3]'
  hidden_notes: '{HIlaD:sen@@HI-:v, laD:v} means "read me!"


