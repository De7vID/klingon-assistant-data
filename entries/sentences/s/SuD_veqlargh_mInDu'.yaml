entry:
  entry_name: SuD veqlargh mInDu'.
  slug: SuD_veqlargh_mInDu'_sen
  part_of_speech: sen:idiom
  pos: sen
  pos_subtype: idiom
  status: canonical
  section: main
  definition: Somebody is jealous.
  see_also: '{veqlargh:n}, {ghal:v}'
  notes: The literal meaning of this idiomatic expression is "Fek'lhr's eyes are green".
  hidden_notes: A calque of Shakespeare's "green-eyed monster" (Othello III.iii),
    with Fek'lhr standing in for Iago's "monster".
  components: '{SuD:v:1}, {veqlargh:n}, {mIn:n}, {-Du'':n}'
  sources:
    raw: '[1] {HQ 8.3, p.4, Sep. 1999:src}'
    citations:
    - source: holqed
      page_start: 4
      volume: 8
      issue: 3
      date: Sep. 1999
  translations:
    de:
      definition: Jemand ist eifersüchtig.
    fa:
      definition: کسی حسود است
    sv:
      definition: Någon är avundsjuk.
    ru:
      definition: Кто-то ревнует.
    zh_HK:
      definition: 有人嫉妒。
    pt:
      definition: Alguém está com ciúmes.
    fi:
      definition: Joku on kateellinen.
    fr:
      definition: Quelqu'un est jaloux.
